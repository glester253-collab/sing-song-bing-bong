name: windows-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check dependency and license changes
        uses: actions/dependency-review-action@v4

  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-debug --parallel

      - name: Test
        run: ctest --preset windows-test-debug --output-on-failure

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-bootstrap-diagnostics
          if-no-files-found: warn
          path: |
            build/windows-msvc/CMakeCache.txt
            build/windows-msvc/CMakeFiles/CMakeConfigureLog.yaml
            build/windows-msvc/Testing/**

      - name: Upload standalone test build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-bootstrap-standalone
          if-no-files-found: error
          path: |
            build/windows-msvc/**/SingSongBingBongApp_artefacts/**
